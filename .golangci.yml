version: "2"

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused) plus
  # checks that catch real bugs in an HTTP service rather than style nits.
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - unconvert
    - usestdlibvars

formatters:
  enable:
    - gofmt
    - goimports
